services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: capstack
      POSTGRES_PASSWORD: capstack
      POSTGRES_DB: capstack
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstack -d capstack"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://capstack:capstack@postgres:5432/capstack"
      AUTH_SECRET: "${AUTH_SECRET:-change-this-to-a-random-32-char-string-in-production}"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      EMAIL_PROVIDER: "${EMAIL_PROVIDER:-console}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM:-}"
    restart: unless-stopped

volumes:
  postgres-data:
